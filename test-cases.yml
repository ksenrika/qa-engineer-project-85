- summary: |
    Проверка синхронизации редакторов кода и вывода тестов между игроками
  requirement: |
    Оба игрока видят друг у друга редактор с кодом и вывод тестов
  prerequisites: |
    Активная игровая сессия между двумя игроками
  test-data: |
    Активная игровая сессия
    Level = medium
    Choose task by name or tags = happy_numbers
  steps:
    - Игрок 1 вводит код в своем редакторе на С++ 
    - Игрок 2 вводит код в своем редакторе на Python 
    - Оба игрока запускают тесты
  expected-result: |
    Код обоих игроков отображается в реальном времени в обоих редакторах
    Вывод тестов синхронизирован и виден обоим игрокам

- summary: |
    Проверка смены языка программирования во время игры
