- summary: |
    Проверка доступности различных задач для решения
  requirement: |
    Сайт должен предоставлять различные задачи для решения
  prerequisites: |
    Пользователь авторизован в системе
  test-data: |
    Choose task by name or tags = random
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Create a battle
    - Выбрать Level - medium
    - В выпадающем окне выбрать Game Type = with other user
    - Просматриваем список доступных задач 
    - Выбрать задачу из списка random
    - Фильтруем задачи по тегам
  expected-result: |
    Отображается список различных задач из разных категорий
    Задачи имеют разный уровень сложности и тематику (отображена в тегах)

- summary: |
    Проверка синхронизации редакторов кода и вывода тестов между игроками
  requirement: |
    Оба игрока видят друг у друга редактор с кодом и вывод тестов
  prerequisites: |
    Активная игровая сессия между двумя игроками
  test-data: |
    Активная игровая сессия
    Level = medium
    Choose task by name or tags = happy_numbers
  steps:
    - Игрок 1 вводит код в своем редакторе на С++ 
    - Игрок 2 вводит код в своем редакторе на Python 
    - Оба игрока запускают тесты
  expected-result: |
    Код обоих игроков отображается в реальном времени в обоих редакторах
    Вывод тестов синхронизирован и виден обоим игрокам

- summary: |
    Проверка смены языка программирования во время игры
  requirement: |
    Оба игрока могут менять язык программирования во время решения
  prerequisites: |
    Активная игровая сессия
    Level = medium
    Choose task by name or tags = happy_numbers
  test-data: |
    Исходный язык: JavaScript
    Новый язык: Python
  steps:
    - Нажать кнопку смены языка программирования
    - Выбрать Python из списка доступных языков
    - Продолжить написание кода
  expected-result: |
    Язык программирования успешно изменен
    Сохранен ранее написанный код, изменился только язык программирования
    Подсветка синтаксиса обновлена

