---
# functional
- summary: |
    Проверка создания игры с другим случайным игроком
  requirement: |
    При корректной работе, у пользователя должна быть возможность выбрать режим игры с другим игроком
  prerequisites: |
    Пользователь авторизован в системе
    В системе есть другие активные игроки
  test-data: |
    Режим игры: бой со случайным игроком
    Уровень сложности: средний
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Create a battle
    - Выбрать Level - medium
    - В выпадающем окне выбрать Game Type = with other user
    - Нажать на кнопку Create a battle в выпадающем окне
  expected-result: |
    Система находит случайного соперника и пользователь начинает игру со случайным сопреником

- summary: |
