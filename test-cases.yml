#тест-кейсы, описывающие регистрацию пользователя

- summary: |
    Проверка процесса регистрации нового пользователя
  requirement: |
    Система должна предоставлять форму регистрации с email и паролем
  prerequisites: |
    Открыта страница регистрации
    Пользоваетель не авторизован
  test-data: |
    Nickname: test_user
    Email: test123@example.com
    Password: Pass-word123
    Password Confirmation: Pass-word123
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Sign Up
    - В поле регистрации ввести Nickname: test_user
    - В поле регистрации ввести Email: test123@example.com
    - В поле регистрации ввести Password: Pass-word123
    - В поле регистрации ввести Password Confirmation: Pass-word123
    - Нажать на кнопку Submit 
  expected-result: |
    Система обрабатывает введеные данные как верные, и отображается сообщение о необходимости подтверждения email

- summary: |
    Проверка подтверждения email адреса
  requirement: |
    Система должна требовать подтверждения email адреса перед активацией аккаунта
  prerequisites: |
    Пользователь завершил регистрацию
  test-data: |
    Email: test123@example.com
  steps:
    - После регистрации на сайте заходим на почту, которую указали
    - На почту test123@example.com должно прийти письмо с подтверждением регистрации
    - Открываем письмо с подтверждением
    - Переходим по ссылке для подтверждения почты
  expected-result: |
    Аккаунт активирован успешно. Пользователь может войти в систему

- summary: |
    Проверка уникальности email при регистрации пользователя
  requirement: |
    Система должна проверять уникальность email при регистрации пользователя
  prerequisites: |
    В системе уже зарегистрирован пользователь с email test123@example.com
  test-data: |
    Email: test123@example.com
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Sign Up
    - В поле регистрации ввести Nickname: test_user
    - В поле регистрации вводим уже существующий email test123@example.com
    - В поле регистрации ввести Password: Pass-word123
    - В поле регистрации ввести Password Confirmation: Pass-word123
    - Нажать на кнопку Submit 
  expected-result: |
    Система показывает ошибку о том, что такой Email уже занят, регистрация не может быть завершена

- summary: |
    Проверка уникальности имени пользователя при регистрации
  requirement: |
    Система должна проверять уникальности имени пользователя при регистрации
  prerequisites: |
    В системе уже зарегистрирован пользователь с именем test_user 
  test-data: |
    Nickname: test_user
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Sign Up
    - В поле регистрации ввести уже существующий Nickname: test_user
    - В поле регистрации вводим email test123@example.com
    - В поле регистрации ввести Password: Pass-word123
    - В поле регистрации ввести Password Confirmation: Pass-word123
    - Нажать на кнопку Submit 
  expected-result: |
    Система показывает ошибку о том, что такой Nickname уже занят, регистрация не может быть завершена

- summary: |
    Проверка возможности получения письма на почту для восстаноление пароля 
  requirement: |
    Система должна отправлять ссылку на почту для восстановления пароля
  prerequisites: |
    Пользователь зарегистрирован с email test123@example.com
  test-data: |
    Email: test123@example.com
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Sign In
    - Нажимаем на Forgot your password?
    - Вводим email пользователя
    - Нажимаем на кнопку Submit 
    - Переходим на указанную почту
  expected-result: |
    После нажатия кнопк, на странице выводится сообщение об успешной отправки на почту инструкции по восстановлению пароля
    На email отправлена ссылка для сброса пароля

- summary: |
    Проверка возможности восстановления пароля через почту
  requirement: |
    Система должна предоставлять возможность восстановления пароля через подтверждение по email
  prerequisites: |
    Пользователь зарегистрирован с email test123@example.com
  test-data: |
    Email: test123@example.com
    New password: New-Pass-word123
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Sign In
    - Нажимаем на Forgot your password?
    - Вводим email пользователя
    - Нажимаем на кнопку Submit 
    - Переходим на указанную почту
    - Переходим по ссылке из письма
    - Вводим новый пароль New-Pass-word123
  expected-result: |
    После нажатия кнопк, на странице выводится сообщение об успешной отправки на почту инструкции по восстановлению пароля
    На email отправлена ссылка для сброса пароля. Пароль успешно изменен после перехода по ссылке
