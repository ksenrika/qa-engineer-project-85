  test-data: |
    Choose task by name or tags = happy_numbers
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Create a battle
    - Выбрать Level - medium
    - В выпадающем окне выбрать Game Type = with a friend
    - Выбрать в выпадающем списке нужного для боя друга
    - Выбрать задачу из списка happy_numbers
  expected-result: |
    Игра создается с выбранной задачей happy_numbers
    Обоим игрокам отображается выбранная задача

