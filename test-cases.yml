---
- summary: |
    Проверка создания игры с другим случайным игроком
  requirement: |
    При корректной работе, у пользователя должна быть возможность выбрать режим игры с другим игроком
  prerequisites: |
    Пользователь авторизован в системе
    В системе есть другие активные игроки
  test-data: |
    Тестовые данные
    Режим игры: бой со случайным игроком
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Create a battle
    - В выпадающем окне выбрать Game Type = with other user
    - Нажать на кнопку Create a battle в выпадающем окне
  expected-result: |
    Система находит случайного соперника и пользователь начинает игру со случайным сопреником

- summary: |
    Проверка создания игры с другом
  requirement: |
    При корректной работе, у пользователя должна быть возможность выбрать режим игры с другом
  prerequisites: |
    Пользователь авторизован в системе
    В системе есть другие активные игроки
    У пользователя в друзьях есть другой пользователь, с которым будет бой
  test-data: |
    Тестовые данные
    Режим игры: бой с другом
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Create a battle
    - В выпадающем окне выбрать Game Type = with a friend
    - Выбрать в выпадающем списке нужного для боя друга
    - Нажать на кнопку Create a battle в выпадающем окне
  expected-result: |
    Система находит вашего друга, который будет вашим соперником, и пользователь начинает игру с другом
