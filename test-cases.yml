    - Нажать на кнопку Create a battle
    - Выбрать Level - medium
    - В выпадающем окне выбрать Game Type = with a friend
    - Выбрать в выпадающем списке нужного для боя друга
    - Нажать на кнопку Create a battle в выпадающем окне
  expected-result: |
    Система находит вашего друга, который будет вашим соперником, и пользователь начинает игру с другом

