- summary: |
    Проверка создания приватной игры по ссылке
  requirement: |
    Сайт должен предоставлять возможность пригласить друга по уникальной ссылке
  prerequisites: |
    Пользователь авторизован в системе
  test-data: |
    Режим игры: приватная игра
    Уровень сложности: средний
  steps:
    - Открыть начальную стараницу сайта
    - Нажать на кнопку Create a battle
    - Выбрать Level - medium
    - В выпадающем окне выбрать Game Type = with a friend
    - Выбрать в выпадающем списке нужного для боя друга
    - Скопировать появившуюся ссылку-приглашение для друга
  expected-result: |
    Система генерирует уникальную ссылку-приглашение
    При переходе по ссылке начинается игровая сессия

- summary: |
    Проверка соревновательного режима решения задач на скорость
  requirement: |
    Сайт должен обеспечивать соревнование двух игроков в решении задач на скорость
  prerequisites: |
    Создана игровая сессия с другим игроком
  test-data: |
    Игровая сессия: два реальных игрока
    Level = medium
    Choose task by name or tags = happy_numbers
  steps:
    - Оба игрока получают одинаковую задачу happy_numbers
    - Игроки начинают писать код одновременно
    - Система отслеживает время решения
    - Первый игрок, выполнивший задачу, отправляет решение
  expected-result: |
    Система определяет победителя на основе скорости и корректности решения
    Результаты отображаются обоим игрокам

- summary: |
